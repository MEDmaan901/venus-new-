<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venus Fleur — Temporarily Paused | Dubai</title>
  <meta name="description" content="Venus Fleur, luxury flowers and floral gifting in Dubai, is taking a short pause. We'll be ready to welcome you back soon.">
  <meta property="og:title" content="Venus Fleur — Temporarily Paused">
  <meta property="og:description" content="Luxury flowers and floral gifting, Dubai. A short pause while we make a few changes behind the scenes.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&amp;family=Karla:wght@300;400&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --charcoal: oklch(17% 0.005 60);
      --ivory: oklch(95% 0.015 85);
      --muted-ivory: oklch(78% 0.02 80);
      --champagne: oklch(78% 0.06 80);
      --hairline: oklch(95% 0.015 85 / 15%);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--charcoal);
      color: var(--ivory);
      font-family: "Karla", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      position: relative;
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      flex-direction: column;
      overflow: hidden;
      isolation: isolate;
    }

    .hero {
      position: absolute;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70% center;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--charcoal) 0%, oklch(17% 0.005 60 / 60%) 52%, oklch(17% 0.005 60 / 10%) 100%);
    }

    .site-header {
      display: flex;
      justify-content: center;
      padding: 2.5rem 1.5rem 0;
    }

    .wordmark {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.5rem;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      white-space: nowrap;
    }

    .announcement {
      display: flex;
      flex: 1;
      align-items: flex-end;
      padding: 6rem 1.5rem 4rem;
    }

    .copy {
      max-width: 36rem;
    }

    .eyebrow,
    .location,
    .footer {
      font-size: 0.6875rem;
      font-weight: 400;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0;
      color: var(--champagne);
      letter-spacing: 0.4em;
    }

    .rule {
      width: 4rem;
      height: 1px;
      margin-top: 1.5rem;
      background: oklch(78% 0.06 80 / 60%);
    }

    .lead {
      margin: 2rem 0 0;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.5rem;
      font-weight: 300;
      line-height: 1.375;
    }

    .details {
      margin-top: 1.5rem;
      color: var(--muted-ivory);
      font-size: 0.875rem;
      line-height: 1.75rem;
    }

    .details p {
      margin: 0;
    }

    .details p + p {
      margin-top: 0.75rem;
    }

    .location {
      margin: 2.5rem 0 0;
      color: oklch(95% 0.015 85 / 70%);
      letter-spacing: 0.4em;
    }

    .footer {
      padding: 1.5rem;
      border-top: 1px solid var(--hairline);
      color: var(--muted-ivory);
      letter-spacing: 0.3em;
    }

    .footer-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .footer-location {
      margin: 0;
    }

    .footer nav {
      display: flex;
      gap: 2.5rem;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
      transition: color 220ms ease;
    }

    .footer a:hover,
    .footer a:focus-visible {
      color: var(--champagne);
    }

    .footer a:focus-visible {
      outline: 1px solid var(--champagne);
      outline-offset: 0.35rem;
    }

    @keyframes vf-fade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes vf-settle {
      from { transform: scale(1.04); }
      to { transform: scale(1); }
    }

    .vf-fade {
      animation: vf-fade 1.6s ease-out 0.3s both;
    }

    .vf-settle {
      animation: vf-settle 3s ease-out both;
    }

    @media (min-width: 640px) {
      .footer-inner {
        flex-direction: row;
      }
    }

    @media (min-width: 768px) {
      .hero::after {
        background: linear-gradient(to right, var(--charcoal) 0%, oklch(17% 0.005 60 / 70%) 50%, transparent 100%);
      }

      .wordmark {
        font-size: 1.875rem;
      }

      .announcement {
        align-items: center;
        padding: 6rem 4rem;
      }

      .lead {
        font-size: 2rem;
      }

      .details {
        font-size: 1rem;
      }

      .footer {
        padding-right: 4rem;
        padding-left: 4rem;
      }
    }

    @media (min-width: 1024px) {
      .announcement,
      .footer {
        padding-right: 6rem;
        padding-left: 6rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .vf-fade,
      .vf-settle {
        animation: none;
      }

      .footer a {
        transition: none;
      }
    }
  </style>
</head>
